<html>
  <head>
    <title>My Map Set Name</title>
    <style type="text/css">
      html, body, #basicMap {
          width: 100%;
          height: 100%;
          margin: 0;
      }
    </style>
    <script src="http://www.openlayers.org/api/OpenLayers.js"></script>
    <script>
      function init() {
        map = new OpenLayers.Map("basicMap");
        var newLayer = new OpenLayers.Layer.OSM("New Layer", "file:///C:/Users/HPZBOOK15G6/Pictures/Downloads/yemen_tiles_folders/tiles/tiles_1980/${z}/${x}/${y}.png", {numZoomLevels: 20});
		map.addLayer(newLayer);
		map.setCenter(new OpenLayers.LonLat(44.20074462890572420,15.35041011841216374) // Center of the map
          .transform(
            new OpenLayers.Projection("EPSG:4326"), // transform from WGS 1984
            new OpenLayers.Projection("EPSG:900913") // to Spherical Mercator Projection
          ), 16 // Zoom level
        );
      }
    </script>
  </head>
  <body onload="init();">
    <div id="basicMap"></div>
  </body>
</html>
