<html>
  <head>
    <title>My Map Set Name</title>
    <style type="text/css">
      html, body, #basicMap {
          width: 100%;
          height: 100%;
          margin: 0;
      }
    </style>
    <script src="http://www.openlayers.org/api/OpenLayers.js"></script>
    <script>
      function init() {
        map = new OpenLayers.Map("basicMap");
        var newLayer = new OpenLayers.Layer.OSM("New Layer", "file:///E:/’›Õ…%20«·Œ—Ìÿ…%20«· Ã—Ì»Ì…/omari_map_data/tiles_1981/${z}/${x}/${y}.jpg", {numZoomLevels: 19});
		map.addLayer(newLayer);
		map.setCenter(new OpenLayers.LonLat(45.45043945312443867,14.12059310063977691) // Center of the map
          .transform(
            new OpenLayers.Projection("EPSG:4326"), // transform from WGS 1984
            new OpenLayers.Projection("EPSG:900913") // to Spherical Mercator Projection
          ), 15 // Zoom level
        );
      }
    </script>
  </head>
  <body onload="init();">
    <div id="basicMap"></div>
  </body>
</html>
